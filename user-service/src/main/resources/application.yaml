spring:
  datasource:
    url: jdbc:h2:mem:userdb
    username: sa
    password:
  config:
    import: optional:configserver:http://localhost:8888
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org:
      springframework:
        cloud:
          netflix:
            eureka: warn
          client:
            discovery: warn
    com:
      netflix:
        discovery: warn