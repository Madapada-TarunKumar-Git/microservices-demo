spring:
  application:
    name: order-service
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:h2:mem:orderdb
    driver-class-name: org.h2.Driver
    name: sa
    password:

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

resilience4j:
  circuitbreaker:
    instances:
      productService:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        minimum-number-of-calls: 3
  retry:
    instances:
      productService:
        max-attempts: 3
        wait-duration: 2s

  timelimiter:
    instances:
      productService:
        timeout-duration: 3s

logging:
  level:
    org:
      springframework:
        cloud:
          netflix:
            eureka: warn
          client:
            discovery: warn
    com:
      netflix:
        discovery: warn